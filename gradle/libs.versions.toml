[versions]
kotlin = "2.4.10"
agp = "9.5.0"
coil = "3.6.3"
compose = "1.12.0"
# Must match the Skiko version that Compose resolves to (see ./gradlew :coil-ppm:dependencies).
skiko = "0.150.1"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"

android-compileSdk = "37"
android-minSdk = "23"

[libraries]
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
skiko-wasm-runtime = { module = "org.jetbrains.skiko:skiko-js-wasm-runtime", version.ref = "skiko" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
compose-ui-graphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "compose" }

# Plugin artifacts used by build-logic
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
